version: 2

models:
  - name: stg_tpch__orders
    description: "Bestellungen mit lesbaren Spaltennamen."
    columns:
      - name: order_id
        description: "Primaerschluessel der Bestellung."
        tests: [unique, not_null]
      - name: customer_id
        description: "Fremdschluessel auf den Kunden."
        tests: [not_null]
      - name: order_status
        description: "F = fulfilled, O = open, P = partial."

  - name: stg_tpch__customers
    columns:
     - name: customer_id
       description: "Kunden mit lesbaren Spaltennamen."
       tests: [unique, not_null]
     - name: market_segment
       tests:
         - accepted_values:
            arguments: 
              values: ['AUTOMOBILE', 'BUILDING', 'FURNITURE', 'HOUSEHOLD', 'MACHINERY']
                  
